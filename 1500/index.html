<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" defer></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
</head>
<body>
    <div class="navbar bg-dark navbar-dark navbar-expand">
        <div class="container">
            <a href="#" class="navbar-brand">
                <i class="fa-solid fa-ghost me-2"></i>App
            </a>
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a href="#" class="nav-link active">
                        <i class="fa-solid fa-home me-1"></i>Home</a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link">
                        <i class="fa-solid fa-user-circle me-1"></i>About</a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link">
                        <i class="fa-solid fa-envelope me-1"></i>Contact</a>
                </li>
            </ul>
        </div>
    </div>
   <div class="container">
        <ul class="nav nav-tabs my-4">
            <li class="nav-item active">
                <a href="#" class="nav-link"><i class="fa-solid fa-users me-1"></i>All Users
                    <span class="badge rounded-pills bg-danger">10</span>
                </a>
            </li>
            <li class="nav-item">
                <a href="#" class="nav-link">New Users</a>
            </li>
            <li class="nav-item dropdown">
                <a href="#" class="nav-link dropdown-toggle" data-bs-toggle="dropdown">Other</a>
                <div class="dropdown-menu">
                    <a href="#" class="dropdown-item">Weekly Users</a>
                    <a href="#" class="dropdown-item">Monthly Users</a>
                    <a href="#" class="dropdown-item">Yearly Users</a>
                </div>
            </li>
            
        </ul>
        <div class="alert alert-danger">
            Hello Welcome From Bootstrap.
        </div>
        <form action="" class="mb-4">
            <div class="mb-2">
                <label for="name">Name</label>
                <input type="text" id="name" class="form-control">
            </div>
            <div class="mb-2">
                <label for="address">Address</label>
                <textarea id="address" class="form-control"></textarea>
            </div>
            <div class="mb-2">
                <label for="gender">Gender</label>
                <select id="gender" class="form-select">
                    <option value="1">Male</option>
                    <option value="2">Female</option>
                </select>
            </div>
            <div class="mb-2">
                <button class="btn btn-secondary"><i class="fa-solid fa-arrow-left me-1"></i>Go Back</button>
                <button class="btn btn-primary"><i class="fa-solid fa-paper-plane me-1"></i>Send</button>
            </div>
        </form>
        <div class="card mb-4 bg-success text-light">
            <div class="card-header">Card Header</div>
            <div class="card-body">Card Body</div>
            <div class="card-footer">Card Footer</div></div>
        <table class="table table-bordered table-striped table-dark">
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Age</th>
            </tr>
            <tr>
                <th>1</th>
                <th>Alice</th>
                <th>22</th>
            </tr>
            <tr>
                <th>2</th>
                <th>Bob</th>
                <th>23</th>
            </tr>
        </table>
        <ul class="list-group">
            <li class="list-group-item">Item One</li>
            <li class="list-group-item active">Item Two</li>
            <li class="list-group-item">Item Three</li>
            <li class="list-group-item">Item Four</li>
        </ul>
   </div>
</body>
</html>
