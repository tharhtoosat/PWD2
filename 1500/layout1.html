<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout</title>
    <style>
        .wrap{
            width: 1000px;
            height: 500px;
            background-color: aqua;
            display: flex;
            align-items: center;
            justify-content: center;
            
            /* flex-direction: column; */
            margin: auto;
            gap: 10px;
        }
        .box{
            width: 200px;
            height: 200px;
            background: deeppink;
            
        }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="box"></div>
        <div class="box" style="flex-grow: 2;"></div>
        <div class="box"></div>
    </div>
</body>
</html>
