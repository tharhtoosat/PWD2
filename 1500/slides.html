<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slides</title>
    <style>
        .wrap{
            position: relative;
            max-width: 800px;
            margin: 0px auto;
        }
        .box{
            height: 250px;
            line-height: 250px;
            text-align: center;
            font-size: 3em;
            color : white;
        }
        .wrap button{
            position: absolute;
            font-size: 3em;
            background: none;
            border: none;
            top: 38%;
            color: white;
            opacity: 0.6;

        }
        #prev{
            left: 30px;
        }
        #next{
            right: 30px;
        }
        #box1{
            background: black;
        }
        #box2{
            background: #222;
            display: none;
        }
        #box3{
            background: #333;
            display: none;
        }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="box" id="box1">1</div>
        <div class="box" id="box2">2</div>
        <div class="box" id="box3">3</div>
        <button id="prev" onclick="prev()">&laquo;</button>
        <button id="next" onclick="next()">&raquo;</button>
    </div>
    <script>
        let box = 1;
        function prev(){
            document.querySelector("#box"+box).style.display = "none";
            box--;
            if(box < 1) box = 3;
            document.querySelector("#box"+box).style.display = "block";
        }
        function next(){
            document.querySelector("#box"+box).style.display = "none";
            box++;
            if(box > 3) box = 1;
            document.querySelector("#box"+box).style.display = "block";
        }
    </script>
</body>
</html>
