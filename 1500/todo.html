<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" defer></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <title>ToDo</title>
</head>
<body>
    <nav class="navbar navbar-dark bg-dark navbar-expand">
        <div class="container">
            <div class="navbar-brand">ToDo <span class=" ms-1 badge bg-danger rounded-pills">0</span></div>
        </div>
    </nav>
    <div class="container">
        <form action="" class="input-group py-4">
            <input type="text" class="form-control">
            <button class="btn btn-dark">Add</button>
        </form>
        <ul id="todo" class="list-group fs-3"></ul>
        <ul id="done" class="list-group mt-4 opacity-50"></ul> 
    </div>
    <script>
        document.querySelector("form").onsubmit = e => {
            e.preventDefault();
            const text = document.querySelector("input").value;
            if(text === "") return false;
            createItem(text);
            updateCount();
            document.querySelector("form").reset();
        }
        // CreateItem
        function createItem(text){
            const li = document.createElement("li");
            
            li.textContent = text;
            li.classList.add("list-group-item","d-flex","align-items-center");
            document.querySelector("#todo").appendChild(li);
            //Check
            const check = document.createElement("a");
            check.setAttribute("href","#");
            check.classList.add("fa-solid","fa-square-check","text-success","float-start",
            "text-decoration-none");
            check.onclick = () =>{
                document.querySelector("#done").appendChild(li);
                updateCount();
                check.remove();
            }
            li.appendChild(check);
            //Delete Button
            const del = document.createElement("a");
            del.setAttribute("href","#");
            del.classList.add("fa-solid","fa-trash","text-danger","ms-auto","text-decoration-none");
            del.onclick = () =>{
                li.remove();
                updateCount();
            }
            li.appendChild(del);
        }
        // Functin count
        function updateCount(){
            document.querySelector(".badge").textContent = document.querySelectorAll("#todo li").length;
        }
    </script> 
</body>
</html>
